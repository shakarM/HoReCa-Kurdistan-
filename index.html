<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoReCa Kurdistan</title>
<link rel="icon" href="brand/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EB;
  --tile:#EBE7DF;
  --ink:#21160F;
  --ink-2:#4D433B;
  --mute:#8D8379;
  --line:#DCD5CA;
  --line-2:#CAC1B4;
  --peach:#FBE1D0;
  --peach-2:#F7EBE1;
  --teal:#86C7C6;
  --brown:#5E2A0D;
  --brown-2:#8A6048;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --pad:clamp(20px,4vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--ar);font-weight:400;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font)}
.num{font-family:var(--font);font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.wrap{padding-inline:var(--pad);max-width:1480px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1.5px solid currentColor;outline-offset:3px}
svg.i{width:17px;height:17px;flex:none}

/* ——— branded landing ——— */
.landing{background:var(--peach);color:var(--brown)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px;border-bottom:1px solid rgba(94,42,13,.16)}
.logo{display:flex;align-items:center}
.logo img{height:24px;width:auto}
.top nav{display:flex;align-items:center;gap:26px;font-size:14px}
.top nav a{color:var(--brown-2);transition:color .2s}
.top nav a:hover{color:var(--brown)}
.lang{display:inline-flex;border:1px solid rgba(94,42,13,.28);border-radius:999px;padding:3px}
.lang button{height:28px;padding-inline:12px;border-radius:999px;font-size:13px;color:var(--brown-2);transition:background .2s,color .2s}
.lang button[aria-pressed="true"]{background:var(--brown);color:var(--peach)}
.listbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding-inline:14px;border:1px solid rgba(94,42,13,.28);border-radius:999px;font-size:13.5px;color:var(--brown);transition:border-color .2s}
.listbtn:hover{border-color:var(--brown)}
.listbtn .c{min-width:20px;height:20px;border-radius:999px;background:var(--brown);color:var(--peach);font-size:11px;display:inline-grid;place-items:center;padding-inline:5px}
.listbtn .c[data-n="0"]{background:transparent;color:var(--brown-2);border:1px solid rgba(94,42,13,.28)}
@media (max-width:900px){.top nav a{display:none}.top nav{gap:10px}}
@media (max-width:480px){.landing .eyebrow{letter-spacing:.14em;font-size:10px}.logo img{height:17px}.listbtn .lbl{display:none}.listbtn{padding-inline:10px}}

.hero{display:grid;grid-template-columns:1fr 1.02fr;gap:var(--pad);align-items:center;padding-block:clamp(44px,7vw,96px)}
.eyebrow{font-family:var(--font);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);direction:ltr;text-align:right}
.landing .eyebrow{color:var(--brown-2)}
.hero h1{font-weight:300;font-size:clamp(38px,5.6vw,78px);line-height:1.14;letter-spacing:-.01em;margin-top:22px;color:var(--brown)}
.hero h1 em{font-style:normal;font-weight:500}
.hero p{max-width:460px;margin-top:24px;color:var(--brown-2);font-size:16px;line-height:1.9}
.hero .row{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding-inline:24px;border-radius:2px;font-size:14.5px;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:#3A2C22}
.btn.ghost{border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--ink)}
.landing .btn.solid{background:var(--brown);color:var(--peach)}
.landing .btn.solid:hover{background:#4A2009}
.landing .btn.ghost{border-color:rgba(94,42,13,.32);color:var(--brown)}
.landing .btn.ghost:hover{border-color:var(--brown)}
.facts{display:flex;gap:clamp(22px,4vw,44px);margin-top:44px;font-size:12.5px;color:var(--brown-2)}
.facts b{display:block;color:var(--brown);font-weight:400;font-size:22px;font-family:var(--font)}
.teaser{display:none}

.panel{position:relative;aspect-ratio:5/4.3;background:var(--teal) url(brand/pattern-top.webp) center/cover;border-radius:2px;overflow:hidden}
.scard{position:absolute;inset-inline:7%;bottom:7%;background:var(--peach)}
.scard .bags{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:16px 16px 0}
.scard .bags img{width:100%;aspect-ratio:3/4;object-fit:contain;mix-blend-mode:multiply}
.scard .cap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px 15px;border-top:1px solid rgba(94,42,13,.16)}
.scard .cap div{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
.scard .cap a{font-size:13px;color:var(--brown-2);white-space:nowrap;border-bottom:1px solid rgba(94,42,13,.3);padding-bottom:1px;transition:color .2s,border-color .2s}
.scard .cap a:hover{color:var(--brown);border-color:var(--brown)}
.pill{display:inline-flex;align-items:center;height:24px;padding-inline:10px;border-radius:999px;background:var(--teal);color:var(--brown);font-size:12px;font-weight:500;white-space:nowrap}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-bottom:0}
  .panel{aspect-ratio:auto;height:96px;margin-inline:calc(var(--pad)*-1)}
  .scard{display:none}
  .teaser{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-size:14px;color:var(--brown)}
  .teaser span:last-child{border-bottom:1px solid rgba(94,42,13,.3)}
  .facts{margin-top:34px;margin-bottom:34px}
}

/* ——— toolbar ——— */
.bar{position:sticky;top:0;z-index:20;background:rgba(244,241,235,.94);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.search{position:relative;flex:0 1 340px;min-width:0}
.search svg{position:absolute;inset-inline-start:0;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--mute);pointer-events:none}
.search input{width:100%;height:44px;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding-inline:28px 64px;font-size:15px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.search input::-webkit-search-cancel-button{display:none}
.search .x,.search kbd{position:absolute;inset-inline-end:0;top:50%;translate:0 -50%}
.search kbd{font-family:var(--font);font-size:11px;color:var(--mute);border:1px solid var(--line-2);border-radius:3px;padding:1px 6px}
.search .x{font-size:12px;color:var(--ink-2);padding:6px 2px;display:none}
.search.has .x{display:block}.search.has kbd{display:none}
@media (hover:none){.search kbd{display:none}}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding-inline:14px;border-radius:999px;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s;white-space:nowrap}
.chip sup{font-family:var(--font);font-size:10.5px;color:var(--mute);top:0;vertical-align:baseline}
.chip:hover{color:var(--ink)}
.chip.zero{opacity:.38}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] sup{color:#A9A095}
.sort{position:relative;flex:none}
.sort select{appearance:none;-webkit-appearance:none;background:transparent;border:0;height:36px;padding-inline:0 20px;font-size:13.5px;color:var(--ink-2);cursor:pointer;font-family:var(--ar)}
.sort::after{content:"";position:absolute;left:2px;top:50%;width:6px;height:6px;border-right:1px solid var(--ink-2);border-bottom:1px solid var(--ink-2);translate:0 -70%;rotate:45deg;pointer-events:none}
@media (max-width:900px){
  .bar .wrap{flex-wrap:wrap;gap:6px 14px;padding-block:10px}
  .search{flex:1 1 100%}
  .chips{order:3;flex:1 1 100%;margin-inline:calc(var(--pad)*-1);padding-inline:var(--pad)}
}

/* ——— catalogue ——— */
.meta{display:flex;justify-content:space-between;align-items:baseline;padding-block:28px 18px;font-size:13px;color:var(--mute)}
.group{margin-bottom:clamp(40px,6vw,80px)}
.ghead{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:18px;padding-block:22px 18px;border-top:1px solid var(--ink)}
.ghead .i{font-family:var(--font);font-size:12px;color:var(--mute);direction:ltr}
.ghead h2{font-weight:400;font-size:clamp(22px,2.4vw,30px);line-height:1.3}
.ghead h2 small{display:block;font-family:var(--font);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:4px;direction:ltr;text-align:right}
.ghead .p{font-size:13px;color:var(--ink-2);text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--paper);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:relative;min-width:0}
.card .ph{background:var(--paper);aspect-ratio:3/4;overflow:hidden;cursor:zoom-in;display:block;width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.035)}
.card .bd{padding:4px 18px 18px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .k{font-family:var(--font);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);direction:ltr;text-align:right}
.grouped .card .k{display:none}
.card h3{font-weight:500;font-size:16.5px;line-height:1.4;margin-top:6px}
.card .en{font-family:var(--font);font-size:12.5px;color:var(--mute);direction:ltr;text-align:right}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:16px}
.price{font-size:15px;white-space:nowrap}
.price .cur{font-family:var(--ar);font-size:11.5px;color:var(--mute);margin-inline-start:4px}
.acts{display:flex;gap:6px}
.ic{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line-2);transition:background .2s,border-color .2s,color .2s}
.ic svg{width:16px;height:16px}
.ic:hover{border-color:var(--ink)}
.ic.wa{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ic.wa:hover{background:#3A2C22}
.ic.on{background:var(--tile);border-color:var(--ink)}
@media (max-width:560px){.card .bd{padding:2px 12px 14px}.card h3{font-size:15px}.ic{width:34px;height:34px}.price{font-size:14px}}
.badge{position:absolute;top:14px;inset-inline-start:14px;font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;background:var(--paper);z-index:1}
.empty{padding:90px 0 120px;text-align:center;color:var(--ink-2)}
.empty h3{font-weight:300;font-size:28px;color:var(--ink);margin-bottom:10px}
.empty .row{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}

/* ——— coming soon ——— */
#soon,#how,#catalog{scroll-margin-top:70px}
@media (max-width:900px){#soon,#how{scroll-margin-top:150px}}
.soon{border-top:1px solid var(--ink);padding-block:clamp(40px,6vw,72px) clamp(48px,7vw,96px)}
.shead{display:grid;grid-template-columns:1fr auto;gap:20px 40px;align-items:end;margin-bottom:clamp(28px,4vw,44px)}
.shead h2{font-weight:300;font-size:clamp(30px,3.6vw,48px);line-height:1.2;margin-top:16px}
.shead h2 .ltr{font-weight:400}
.shead p{color:var(--ink-2);margin-top:12px;max-width:560px;line-height:1.9}
@media (max-width:760px){.shead{grid-template-columns:1fr}.shead .btn{justify-self:start}}
.soon .card .ph{background:var(--peach-2);cursor:default}
.soon .card h3{font-family:var(--font);direction:ltr;text-align:right;font-weight:500}
.soon .card .mix{font-size:12.5px;color:var(--mute);margin-top:2px}
.soon .card .note{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.75}
.soon .card .ft{flex-wrap:wrap}
.more{display:inline-flex;align-items:center;gap:8px;height:38px;padding-inline:14px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:13px;transition:background .2s}
.more:hover{background:#3A2C22}
.more svg{width:15px;height:15px}
.soonlbl{font-size:12.5px;color:var(--brown);display:inline-flex;align-items:center;gap:7px}
.soonlbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}
.ph-oro{width:100%;height:100%;display:grid;place-items:center;background:var(--teal) url(brand/pattern-bottom.webp) center/cover}
.ph-oro span{background:var(--peach);color:var(--brown);font-family:var(--font);padding:14px 20px;text-align:center;line-height:1.25;font-size:13px;letter-spacing:.06em}
.ph-oro b{display:block;font-weight:500;font-size:26px;letter-spacing:.24em}
@media (max-width:560px){.more{height:34px;padding-inline:12px;font-size:12.5px}.soon .card .note{display:none}}

/* ——— how to order ——— */
.how{border-top:1px solid var(--ink);padding-block:clamp(48px,7vw,96px);display:grid;grid-template-columns:1fr 2fr;gap:var(--pad)}
.how h2{font-weight:300;font-size:clamp(28px,3.4vw,44px);line-height:1.2}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.steps li{list-style:none;border-top:1px solid var(--line-2);padding-top:18px}
.steps .n{font-family:var(--font);font-size:12px;color:var(--mute)}
.steps h4{font-weight:500;font-size:16px;margin:10px 0 6px}
.steps p{color:var(--ink-2);font-size:14px;line-height:1.85}
@media (max-width:900px){.how{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:30px 120px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
footer a{color:var(--ink)}
footer img{height:16px;width:auto;opacity:.9}

/* ——— sheets ——— */
.scrim{position:fixed;inset:0;background:rgba(33,22,15,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--paper);transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;visibility:hidden}
.sheet.on{visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.qv{inset-block:0;left:0;width:min(940px,100%);transform:translateX(-100%);display:grid;grid-template-columns:1fr 1fr}
.qv.on{transform:none}
.qv .im{background:var(--tile);display:grid;place-items:center;padding:6%}
.qv .im img{max-height:82vh;mix-blend-mode:multiply}
.qv .tx{padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;overflow:auto}
.close{align-self:flex-start;font-size:13px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;padding:6px 0}
.close:hover{color:var(--ink)}
.qv .qcat{margin-top:clamp(28px,6vh,64px)}
.qv h2{font-weight:300;font-size:clamp(32px,3.6vw,46px);line-height:1.15;margin-top:12px}
.qv .en{font-family:var(--font);color:var(--mute);margin-top:8px;direction:ltr;text-align:right}
.qv dl{margin-top:34px;border-top:1px solid var(--line)}
.qv dl div{display:flex;justify-content:space-between;padding-block:13px;border-bottom:1px solid var(--line);font-size:14px}
.qv dt{color:var(--mute)}
.qv .note{margin-top:22px;color:var(--ink-2);font-size:14px;line-height:1.9}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:2px;height:48px}
.qty button{width:44px;height:100%;font-size:18px;color:var(--ink-2)}
.qty button:hover{color:var(--ink)}
.qty output{min-width:34px;text-align:center;font-family:var(--font)}
.qv .buy{margin-top:auto;padding-top:34px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.qv .buy .btn.solid{grid-column:1/-1}
@media (max-width:760px){
  .qv{inset:auto 0 0 0;width:100%;max-height:92vh;transform:translateY(100%);grid-template-columns:1fr;grid-template-rows:auto 1fr;border-radius:14px 14px 0 0;overflow:hidden}
  .qv .im{padding:18px 0 0;height:36vh;overflow:hidden;display:flex;justify-content:center}
  .qv .im img{height:100%;width:auto;max-height:none;object-fit:contain}
  .qv .tx{padding:20px 22px 0}
  .qv .qcat{margin-top:4px}
  .qv h2{font-size:30px}
  .qv dl{margin-top:20px}
  .qv .buy{position:sticky;bottom:0;background:var(--paper);padding-block:16px 20px;margin-top:8px}
  .qv .close{position:absolute;top:14px;inset-inline-end:16px;background:var(--paper);border-radius:999px;padding:6px 12px}
}
.drawer{inset-block:0;left:0;width:min(440px,100%);transform:translateX(-100%);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line)}
.drawer header h2{font-weight:400;font-size:20px}
.drawer .items{flex:1;overflow:auto;padding-inline:26px}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.li img{width:64px;height:85px;object-fit:contain;background:var(--tile);mix-blend-mode:multiply}
.li h4{font-weight:500;font-size:14.5px}
.li .s{font-size:12px;color:var(--mute)}
.li .qty{height:34px}
.li .qty button{width:30px;font-size:15px}
.li .qty output{min-width:22px;font-size:13px}
.li .rm{font-size:12px;color:var(--mute);margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.drawer .sum{padding:22px 26px 26px;border-top:1px solid var(--ink);display:grid;gap:14px}
.drawer .tot{display:flex;justify-content:space-between;font-size:15px}
.drawer .tot b{font-weight:500;font-size:20px}
.drawer .hint{font-size:12.5px;color:var(--mute);line-height:1.8}
.drawer .clr{font-size:12.5px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;justify-self:center}
.drawer .none{padding:70px 0;text-align:center;color:var(--mute)}
.fab{position:fixed;z-index:30;bottom:20px;left:50%;translate:-50% 140%;background:var(--ink);color:var(--paper);border-radius:999px;height:52px;padding-inline:8px 22px;display:flex;align-items:center;gap:14px;font-size:14px;transition:translate .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px -12px rgba(33,22,15,.5)}
.fab.on{translate:-50% 0}
.fab .c{background:var(--paper);color:var(--ink);border-radius:999px;height:36px;min-width:36px;display:grid;place-items:center;font-family:var(--font);font-size:13px;padding-inline:8px}
.fab .t{color:#ADA399;font-size:13px}
.toast{position:fixed;z-index:60;top:20px;left:50%;translate:-50% calc(-100% - 40px);background:var(--ink);color:var(--paper);font-size:13.5px;padding:10px 18px;border-radius:999px;transition:translate .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{translate:-50% 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="landing" id="top">

const norm = s => (s||"").toLowerCase()
  .replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ؤ/g,"و").replace(/[ئء]/g,"")
  .replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه").replace(/[ۆو]/g,"و").replace(/[ێې]/g,"ی").replace(/ڕ/g,"ر").replace(/ڵ/g,"ل").replace(/ڤ/g,"ف").replace(/[ەه]/g,"ه")
  .replace(/[’'\-\s·.,—]/g,"").replace(/[çà]/g,m=>({ç:"c",à:"a"}[m]));
PRODUCTS.forEach(p=>{const c=cat(p.cat);p.hay=norm([p.en,p.ku,p.ar,c.ku,c.ar,c.en,p.dku,p.dar].join("|"))});

const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang = store.get("horeca-lang","ku"); if(!T[lang]) lang="ku";

let list = store.get("horeca-list",{}) || {};

/* ——— language ——— */
function applyLang(){
  document.documentElement.lang = lang==="ar" ? "ar" : "ckb";
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML = t(el.dataset.t) });
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#q").placeholder = t("search_ph");
  $("#sort").innerHTML = ["def","az","lo","hi"].map((v,i)=>`<option value="${v}">${t("sorts")[i]}</option>`).join("");
  $("#sort").value = state.sort;
  $("#chips").setAttribute("aria-label", t("l_cat"));
  $("#heroWa").href = waLink(t("m_hello"));
  $("#phoneLink").href = waLink(t("m_hello"));
  $("#soonAll").href = waLink(t("m_soon_all"));
  $("#qMinus").setAttribute("aria-label","−"); $("#qPlus").setAttribute("aria-label","+");
  render(); renderSoon(); refreshList();
  if(openSheet===$("#qv") && qvItem) fillQv();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ if(lang===b.dataset.lang) return; lang=b.dataset.lang; store.set("horeca-lang",lang); applyLang() });

/* ——— catalogue ——— */
function renderChips(){
  const q = norm(state.q);
  const pool = PRODUCTS.filter(p=>!q || p.hay.includes(q));
  const n = id => id==="all" ? pool.length : pool.filter(p=>p.cat===id).length;
  const all = [{id:"all"}, ...CATS];
  $("#chips").innerHTML = all.map(c=>`<button class="chip${n(c.id)?"":" zero"}" type="button" data-cat="${c.id}" aria-pressed="${state.cat===c.id}">${c.id==="all"?t("all"):c[lang]}<sup class="num">${n(c.id)}</sup></button>`).join("");
}
function card(p){
  const c = cat(p.cat), inList = !!list[p.id];
  return `<article class="card" data-id="${p.id}">
    ${p.size?`<span class="badge">${t("sizes")[p.size]}</span>`:""}
    <button class="ph" type="button" data-open="${p.id}" aria-label="${t("details")} — ${pname(p)}"><img src="${p.img}" alt="${p.en} — ${pname(p)}" loading="lazy" width="600" height="800"></button>
    <div class="bd">
      <div class="k">${c.en.split(" · ")[0]}</div>
      <h3>${pname(p)}</h3>
      <div class="en">${p.en}</div>
      <div class="ft">
        <div class="price"><span class="num">${fmt(p.price)}</span><span class="cur">${t("cur")}</span></div>
        <div class="acts">
          <button class="ic ${inList?"on":""}" type="button" data-add="${p.id}" aria-label="${inList?t("inlist"):t("add")}" title="${inList?t("inlist"):t("add")}">${inList?IC.check:IC.plus}</button>
          <a class="ic wa" href="${waLink(t("m_one")(p,1))}" target="_blank" rel="noopener" aria-label="${t("order")}" title="${t("order")}">${IC.wa}</a>
        </div>
      </div>
    </div>
  </article>`;
}
function render(){
  const q = norm(state.q);
  let items = PRODUCTS.filter(p=>(state.cat==="all"||p.cat===state.cat) && (!q||p.hay.includes(q)));
  const sorters = {def:(a,b)=>a.order-b.order, az:(a,b)=>a.en.localeCompare(b.en)||a.order-b.order, lo:(a,b)=>a.price-b.price||a.order-b.order, hi:(a,b)=>b.price-a.price||a.order-b.order};
  items.sort(sorters[state.sort]);
  $("#count").innerHTML = `<span class="num">${items.length}</span> ${t("items")}`;
  $("#crumb").textContent = state.q ? t("results")(state.q) : "";
  renderChips();
  const out = $("#out");
  out.classList.toggle("grouped", state.sort==="def");
  if(!items.length){
    out.innerHTML = `<div class="empty"><h3>${t("empty_h")}</h3><p>${t("empty_p")}</p>
      <div class="row"><button class="btn ghost" type="button" id="reset">${t("show_all")}</button><a class="btn solid" href="${waLink(t("m_search")(state.q))}" target="_blank" rel="noopener">${IC.wa}${t("cta_wa")}</a></div></div>`;
    $("#reset").onclick = ()=>{state.q="";state.cat="all";$("#q").value="";syncSearch();render();setHash()};
    return;
  }
  if(state.sort==="def"){
    const groups = CATS.map((c,i)=>({c,i,list:items.filter(p=>p.cat===c.id)})).filter(g=>g.list.length);
    out.innerHTML = groups.map(g=>{
      const prices=[...new Set(g.list.map(p=>p.price))].sort((a,b)=>a-b);
      const pr = prices.length>1?`<span class="num">${fmt(prices[0])}–${fmt(prices.at(-1))}</span> ${t("cur")}`:`<span class="num">${fmt(prices[0])}</span> ${t("cur")}`;
      return `<section class="group"><div class="ghead"><span class="i">${String(g.i+1).padStart(2,"0")}</span><h2>${g.c[lang]}<small>${g.c.en}</small></h2><span class="p">${pr} · <span class="num">${g.list.length}</span> ${t("kinds")}</span></div><div class="grid">${g.list.map(card).join("")}</div></section>`;
    }).join("");
  } else {
    out.innerHTML = `<div class="grid" style="margin-bottom:80px">${items.map(card).join("")}</div>`;
  }
}
function renderSoon(){
  const mix = m => !m ? t("mix_tbd") : [m[0]?`<span class="num">${m[0]}%</span> ${t("arabica")}`:"", m[1]?`<span class="num">${m[1]}%</span> ${t("robusta")}`:""].filter(Boolean).join(" · ");
  $("#soonGrid").innerHTML = SOON.map(s=>`<article class="card">
    <div class="ph">${s.img?`<img src="img/${s.img}.webp" alt="${s.name}" loading="lazy" width="600" height="800">`:`<div class="ph-oro"><span class="ltr">Qualità Extra Bar<b>ORO</b></span></div>`}</div>
    <div class="bd">
      <div class="k">Amigos Caffè</div>
      <h3>${s.name}</h3>
      <div class="mix">${mix(s.mix)}</div>
      <p class="note">${s[lang]}</p>
      <div class="ft"><span class="soonlbl">${t("soon")}</span><a class="more" href="${waLink(t("m_soon_one")(s.name))}" target="_blank" rel="noopener">${IC.wa}${t("more")}</a></div>

/* search */
const qEl = $("#q");
function syncSearch(){ $("#searchBox").classList.toggle("has", !!qEl.value) }
let tm; qEl.addEventListener("input",()=>{ syncSearch(); clearTimeout(tm); tm=setTimeout(()=>{state.q=qEl.value.trim();render()},90) });
$("#clearQ").onclick = ()=>{ qEl.value=""; state.q=""; syncSearch(); render(); qEl.focus() };
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==qEl && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); qEl.focus(); }
  if(e.key==="Escape"){ if(openSheet) closeAll(); else if(document.activeElement===qEl && qEl.value){ $("#clearQ").click() } }
});
$("#sort").onchange = e=>{ state.sort=e.target.value; render() };

function setHash(){ try{ history.replaceState(null,"",state.cat==="all"?location.pathname+location.search:"#"+state.cat) }catch(e){} }
function readHash(){ const h=location.hash.slice(1); if(CATS.some(c=>c.id===h)) state.cat=h; else if(!h) state.cat="all"; }
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest("[data-cat]"); if(!b) return;
  state.cat=b.dataset.cat; render(); setHash();
  const bar=$(".bar"); if(bar.getBoundingClientRect().top>1) bar.scrollIntoView({behavior:"smooth"});
});
window.addEventListener("hashchange",()=>{ readHash(); render() });

/* list */
const listCount = () => Object.values(list).reduce((a,b)=>a+b,0);
const listTotal = () => Object.entries(list).reduce((a,[id,q])=>a+byId[id].price*q,0);
function refreshList(){
  const n=listCount();
  $("#listCount").textContent=n; $("#listCount").dataset.n=n;
  $("#fabC").textContent=n; $("#fabT").textContent = n?`${fmt(listTotal())} ${t("cur")}`:"";
  $("#fab").classList.toggle("on", n>0 && !openSheet);
  if(openSheet===$("#drawer")) renderDrawer();
}
function addToList(id,q=1){
  list[id]=(list[id]||0)+q; saveList(); refreshList();
  document.querySelectorAll(`[data-add="${id}"]`).forEach(b=>{b.classList.add("on");b.innerHTML=IC.check;b.setAttribute("aria-label",t("inlist"));b.title=t("inlist")});
  toast(t("added")(pname(byId[id])));
}
function renderDrawer(){
  const ids=Object.keys(list);
  if(!ids.length){ $("#items").innerHTML=`<div class="none">${t("list_empty")}</div>`; $("#sum").innerHTML=""; return; }
  $("#items").innerHTML = ids.map(id=>{const p=byId[id];return `<div class="li"><img src="${p.img}" alt=""><div><h4>${pname(p)}</h4><div class="s"><span class="ltr">${p.en}</span> · ${cname(p.cat)}${p.size?" · "+t("sizes")[p.size]:""}</div><div class="s num">${fmt(p.price)} × ${list[id]}</div><button class="rm" type="button" data-rm="${id}">${t("remove")}</button></div><div class="qty"><button type="button" data-dec="${id}" aria-label="−">−</button><output class="num">${list[id]}</output><button type="button" data-inc="${id}" aria-label="+">+</button></div></div>`}).join("");
  const lines = ids.map((id,i)=>{const p=byId[id];return `${i+1}. ${p.en} — ${pname(p)} (${cname(p.cat)}${p.size?"، "+t("sizes")[p.size]:""}) × ${list[id]} = ${fmt(p.price*list[id])} د.ع`}).join("\n");
  $("#sum").innerHTML = `<div class="tot"><span>${t("total")} · <span class="num">${listCount()}</span> ${t("pcs")}</span><b class="num">${fmt(listTotal())} <span style="font-family:var(--ar);font-size:13px;color:var(--mute)">${t("cur")}</span></b></div>
    <a class="btn solid" href="${waLink(t("m_list")(lines,fmt(listTotal())))}" target="_blank" rel="noopener">${IC.wa}${t("send")}</a>
    <div class="hint">${t("hint")}</div>
    <button class="clr" type="button" id="clr">${t("clear_list")}</button>`;
  $("#clr").onclick=()=>{ list={}; saveList(); refreshList(); render() };
}
$("#items").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const {inc,dec,rm}=b.dataset;
  if(inc) list[inc]++;
  if(dec){ list[dec]--; if(list[dec]<1) delete list[dec]; }
  if(rm) delete list[rm];
  saveList(); refreshList(); if(dec||rm) render();
});

/* sheets */
let openSheet=null, lastFocus=null, qvItem=null, qvQty=1;
function show(el){
  lastFocus=document.activeElement; openSheet=el;
  el.classList.add("on"); el.setAttribute("aria-hidden","false"); $("#scrim").classList.add("on");
  document.body.style.overflow="hidden"; $("#fab").classList.remove("on");
  setTimeout(()=>el.querySelector("[data-close]").focus({preventScroll:true}),60);
}
function closeAll(){
  document.querySelectorAll(".sheet.on").forEach(s=>{s.classList.remove("on");s.setAttribute("aria-hidden","true")});
  $("#scrim").classList.remove("on"); document.body.style.overflow=""; openSheet=null; refreshList();
  if(lastFocus) lastFocus.focus({preventScroll:true});
}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
$("#scrim").onclick=closeAll;
const openDrawer=()=>{ renderDrawer(); show($("#drawer")) };
$("#openList").onclick=openDrawer; $("#fab").onclick=openDrawer;

function setQv(){
  $("#qVal").textContent=qvQty;
  $("#qvWa").innerHTML=`${IC.wa}${t("order")} · <span class="num">${fmt(qvItem.price*qvQty)}</span> ${t("cur")}`;
  $("#qvWa").href=waLink(t("m_one")(qvItem,qvQty));
}
function fillQv(){
  const p=qvItem, c=cat(p.cat);
  $("#qvImg").src=p.img; $("#qvImg").alt=p.en;
  $("#qvCat").textContent=c.en; $("#qvTitle").textContent=pname(p); $("#qvEn").textContent=p.en;
  const taste = lang==="ar"?p.dar:p.dku;
  $("#qvDl").innerHTML=`<div><dt>${t("l_cat")}</dt><dd>${c[lang]}</dd></div>${p.size?`<div><dt>${t("l_size")}</dt><dd>${t("sizes")[p.size]}</dd></div>`:""}${taste?`<div><dt>${t("l_taste")}</dt><dd>${taste}</dd></div>`:""}<div><dt>${t("l_price")}</dt><dd><span class="num">${fmt(p.price)}</span> ${t("cur")}</dd></div>`;
  $("#qvNote").textContent = lang==="ar"?c.nar:c.nku;
  setQv();
}
function openQv(id){ qvItem=byId[id]; qvQty=1; fillQv(); show($("#qv")) }
$("#qMinus").onclick=()=>{ if(qvQty>1){qvQty--;setQv()} };
$("#qPlus").onclick=()=>{ qvQty++;setQv() };
$("#qvAdd").onclick=()=>{ addToList(qvItem.id,qvQty); closeAll() };

$("#out").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o) return openQv(o.dataset.open);
  const a=e.target.closest("[data-add]"); if(a){ if(list[a.dataset.add]) openDrawer(); else addToList(a.dataset.add); }
});

let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1800) }

$("#fTotal").textContent=PRODUCTS.length;
readHash(); applyLang();
</script>
</body>
</html>
